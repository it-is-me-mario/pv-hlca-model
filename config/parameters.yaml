# PV-HLCA parameters — extracted verbatim from thesis script (IRENA 2024, etc.)
W_per_m2: 195                       # = module_efficiency_ref * 1000 W/m2 (STC)
module_efficiency_ref: 0.195       # reference module efficiency baked into the inventory
usd_to_eur: 0.9272137227630969
use_of_PV_m2_per_TJ: 50.1494668259254
lifetime_years: 25
om_labor_share: 0.35
# LCI sensitivity (R2.4): electricity intensity of the upstream PV stages under two
# published inventories. Reference = IEA PVPS Task 12 (2020, baked into Add_sectors.xlsx);
# variant = NREL (Smith et al. 2024, DOI 10.2172/2331433). The 'NREL' lever scales the
# Electricity coefficient of each '<stage> production' activity by nrel/iea (Excel untouched).
lci_electricity_kwh_per_kg:           # per kg of stage output
  Solar Grade silicon: {iea: 49.0,  nrel: 72.0}    # x1.469
  Ingot:               {iea: 32.0,  nrel: 38.4}    # x1.200
  Wafer:               {iea: 4.762, nrel: 2.35}    # x0.494
  Metallurgical Grade silicon: {iea: 11.0, nrel: 11.0}   # x1.000 (unchanged)
gwp_factors:                         # IPCC AR6 GWP-100 (matches mario calc_ghg AR6 profile)
  Carbon dioxide: 1
  N2O: 273
  CH4: 29.8
kWh_per_TJ_to_g_factor: 3.6
