[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pv-hlca-model"
version = "1.1.0.dev0"
description = "Hybrid input-output model of photovoltaic supply chains and scenarios"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Engine installed separately by tools/install.py: MARIO 1.0.0's optional
# cvxlab requirement conflicts with its own pandas pin (see docs/installation.md).
dependencies = ["numpy==2.1.1", "pandas==3.0.2", "PyYAML>=6", "pyarrow>=19", "openpyxl==3.1.5", "matplotlib>=3.9"]

[project.scripts]
pv-hlca = "pv_hlca.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pv_hlca"]

[tool.hatch.build.targets.wheel.force-include]
"config" = "pv_hlca/resources/config"
"data" = "pv_hlca/resources/data"
"reference" = "pv_hlca/resources/reference"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: runs the full PV model on the external base database"]
